name: Daily deal notification

on:
  schedule:
    # GitHub cron is UTC only, so both are registered and a gate step below
    # keeps whichever one is 18:00 in New York today.
    - cron: "0 22 * * *"   # 18:00 ET while EDT is in effect
    - cron: "0 23 * * *"   # 18:00 ET while EST is in effect
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Validate and print, but do not send a notification"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-deal
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Decide whether this is the 18:00 ET run
        id: gate
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "Manual run - proceeding."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Two crons are registered because GitHub only speaks UTC and New
          # York moves twice a year. Exactly one is correct on any given day.
          #
          # This deliberately does NOT check the current clock time. GitHub
          # routinely runs scheduled jobs late, and a delay past the hour would
          # make an hour-equals-18 test skip the day entirely. Which cron fired
          # is a fact that a delay cannot change.
          OFFSET=$(TZ=America/New_York date +%z)
          SCHEDULE="${{ github.event.schedule }}"

          case "$OFFSET" in
            -0400) WANTED="0 22 * * *" ;;   # EDT: 22:00 UTC is 18:00 ET
            -0500) WANTED="0 23 * * *" ;;   # EST: 23:00 UTC is 18:00 ET
            *)     echo "Unexpected New York offset $OFFSET - proceeding anyway."
                   echo "should_run=true" >> "$GITHUB_OUTPUT"; exit 0 ;;
          esac

          if [ "$SCHEDULE" = "$WANTED" ]; then
            echo "New York is at UTC$OFFSET, so '$SCHEDULE' is today's 18:00 ET run."
            echo "Actual start: $(TZ=America/New_York date '+%H:%M %Z') (delay is fine)."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "New York is at UTC$OFFSET, so '$WANTED' is today's run, not '$SCHEDULE'."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.should_run == 'true'
        with:
          python-version: "3.11"

      - name: Check configuration
        if: steps.gate.outputs.should_run == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          # Only ever reports presence and length - never a value.
          ok=1
          report () {
            if [ -z "$2" ]; then
              echo "  MISSING   $1   <- add this secret in Settings > Secrets and variables > Actions"
              ok=0
            else
              echo "  ok        $1   (${#2} characters)"
            fi
          }
          echo "Secrets:"
          report GEMINI_API_KEY      "$GEMINI_API_KEY"
          report GMAIL_ADDRESS       "$GMAIL_ADDRESS"
          report GMAIL_APP_PASSWORD  "$GMAIL_APP_PASSWORD"

          stripped="${GMAIL_APP_PASSWORD// /}"
          if [ -n "$GMAIL_APP_PASSWORD" ] && [ ${#stripped} -ne 16 ]; then
            echo "  WARNING   GMAIL_APP_PASSWORD is ${#stripped} characters, expected 16."
            echo "            Looks like a partial paste. Recreate it at"
            echo "            https://myaccount.google.com/apppasswords"
            ok=0
          fi

          if [ "$ok" -ne 1 ]; then
            echo ""
            echo "Configuration is incomplete - stopping before we waste an API call."
            exit 1
          fi
          echo ""
          echo "Configuration looks good."

      - name: Fetch and shortlist candidates
        if: steps.gate.outputs.should_run == 'true'
        run: python3 scripts/fetch_candidates.py

      - name: Select the winning deal
        if: steps.gate.outputs.should_run == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: python3 scripts/select_deal.py

      - name: Send the notification
        if: steps.gate.outputs.should_run == 'true'
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_TO: ${{ secrets.NOTIFY_TO }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python3 scripts/send_notification.py --dry-run
          else
            python3 scripts/send_notification.py
          fi

      - name: Record what was sent
        if: steps.gate.outputs.should_run == 'true' && inputs.dry_run != true
        run: |
          git config user.name "deal-bot"
          git config user.email "deal-bot@users.noreply.github.com"
          git add state/sent.json
          if git diff --staged --quiet; then
            echo "No state change to commit."
          else
            git commit -m "Sent daily deal notification [skip ci]"
            git push
          fi

      - name: Upload run details for debugging
        if: always() && steps.gate.outputs.should_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: run-${{ github.run_id }}
          path: work/
          retention-days: 14
          if-no-files-found: ignore
