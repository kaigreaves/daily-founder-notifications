name: Daily deal notification

on:
  schedule:
    # GitHub cron is UTC only, so both are registered and a gate step below
    # keeps whichever one is 18:00 in New York today.
    - cron: "0 22 * * *"   # 18:00 ET while EDT is in effect
    - cron: "0 23 * * *"   # 18:00 ET while EST is in effect
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Validate and print, but do not send a notification"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-deal
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Decide whether to run
        id: gate
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "Manual run - proceeding."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Two crons are registered because GitHub speaks only UTC while New
          # York moves twice a year. Rather than decide which cron "should" own
          # today, both are allowed to try: the first to arrive at or after
          # 18:00 ET wins, and the other finds today's date already recorded
          # and stands down.
          #
          # The previous version compared github.event.schedule against the
          # cron expected for the current DST offset. That fails CLOSED and
          # SILENTLY if the expression is ever empty - a green run with every
          # step skipped and no email - which is what took the job down.
          # This version has no such branch: the default is to run.
          TODAY=$(TZ=America/New_York date +%F)
          HOUR=$((10#$(TZ=America/New_York date +%H)))
          LAST=$(tr -d '[:space:]' < state/last_run.txt 2>/dev/null || true)

          echo "New York now : $TODAY at ${HOUR}:00"
          echo "Last run     : ${LAST:-never}"

          if [ "$LAST" = "$TODAY" ]; then
            echo "-> Already ran today. Standing down."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          elif [ "$HOUR" -lt 18 ]; then
            echo "-> Before 18:00 ET. The later cron takes today."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          else
            echo "-> Proceeding."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.should_run == 'true'
        with:
          python-version: "3.11"

      - name: Check configuration
        id: config
        if: steps.gate.outputs.should_run == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          # Only ever reports presence and length - never a value.
          ok=1
          report () {
            if [ -z "$2" ]; then
              echo "  MISSING   $1   <- add this secret in Settings > Secrets and variables > Actions"
              ok=0
            else
              echo "  ok        $1   (${#2} characters)"
            fi
          }
          echo "Secrets:"
          report GEMINI_API_KEY      "$GEMINI_API_KEY"
          report GMAIL_ADDRESS       "$GMAIL_ADDRESS"
          report GMAIL_APP_PASSWORD  "$GMAIL_APP_PASSWORD"

          stripped="${GMAIL_APP_PASSWORD// /}"
          if [ -n "$GMAIL_APP_PASSWORD" ] && [ ${#stripped} -ne 16 ]; then
            echo "  WARNING   GMAIL_APP_PASSWORD is ${#stripped} characters, expected 16."
            echo "            Looks like a partial paste. Recreate it at"
            echo "            https://myaccount.google.com/apppasswords"
            ok=0
          fi

          if [ "$ok" -ne 1 ]; then
            echo ""
            echo "Configuration is incomplete - stopping before we waste an API call."
            exit 1
          fi
          echo ""
          echo "Configuration looks good."

          # Import every module before spending an API call. py_compile only
          # checks syntax; a name referenced before it is defined still parses
          # fine and then dies at runtime, which is exactly how this pipeline
          # broke once.
          echo ""
          echo "Import check:"
          PYTHONPATH=scripts python3 -c "import common, fetch_candidates, select_deal, send_notification; print('  all modules import cleanly')"

      - name: Fetch and shortlist candidates
        id: fetch
        if: steps.gate.outputs.should_run == 'true'
        run: python3 scripts/fetch_candidates.py

      - name: Select the winning deal
        id: select
        if: steps.gate.outputs.should_run == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: python3 scripts/select_deal.py

      # The property section is a bonus. continue-on-error keeps a bad day
      # for real-estate feeds from blocking the acquisition email, which is
      # the part that must not fail.
      - name: Fetch property candidates
        id: refetch
        if: steps.gate.outputs.should_run == 'true'
        continue-on-error: true
        run: python3 scripts/fetch_candidates.py --mode realestate

      - name: Select property deals
        id: reselect
        if: steps.gate.outputs.should_run == 'true'
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: python3 scripts/select_deal.py --mode realestate

      - name: Send the notification
        id: send
        if: steps.gate.outputs.should_run == 'true'
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_TO: ${{ secrets.NOTIFY_TO }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python3 scripts/send_notification.py --dry-run
          else
            python3 scripts/send_notification.py
          fi

      - name: Record the run
        id: record
        if: steps.gate.outputs.should_run == 'true' && inputs.dry_run != true
        run: |
          # Written even on a no-deal day: it is both the "already ran today"
          # marker and a visible heartbeat in the commit log.
          TZ=America/New_York date +%F > state/last_run.txt
          git config user.name "deal-bot"
          git config user.email "deal-bot@users.noreply.github.com"
          git add state/last_run.txt state/sent.json
          if git diff --staged --quiet; then
            echo "Nothing to record."
          else
            git commit -m "Daily run $(TZ=America/New_York date +%F) [skip ci]"
            git pull --rebase --autostash origin main || true
            git push
          fi

      # Puts the outcome of every step on the run's front page, so a failure
      # can be read without expanding anything.
      - name: Summary
        if: always()
        run: |
          {
            echo "## Daily deal run"
            echo ""
            echo "Gate decision: \`${{ steps.gate.outputs.should_run }}\`"
            echo ""
            echo "| Step | Result |"
            echo "| --- | --- |"
            echo "| Check configuration | ${{ steps.config.outcome || 'skipped' }} |"
            echo "| Fetch acquisitions | ${{ steps.fetch.outcome || 'skipped' }} |"
            echo "| Select acquisition | ${{ steps.select.outcome || 'skipped' }} |"
            echo "| Fetch property | ${{ steps.refetch.outcome || 'skipped' }} |"
            echo "| Select property | ${{ steps.reselect.outcome || 'skipped' }} |"
            echo "| Send email | ${{ steps.send.outcome || 'skipped' }} |"
            echo "| Record run | ${{ steps.record.outcome || 'skipped' }} |"
            echo ""
            if [ "${{ job.status }}" != "success" ]; then
              echo "### Something failed"
              echo ""
              echo "The first step above showing \`failure\` is the one to open."
              echo "Its log ends with a line starting \`ERROR:\` explaining why."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload run details for debugging
        if: always() && steps.gate.outputs.should_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: run-${{ github.run_id }}
          path: work/
          retention-days: 14
          if-no-files-found: ignore
